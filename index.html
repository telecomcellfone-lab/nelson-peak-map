<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nelson Peak Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.6.1/maplibre-gl.css">
<style>
  :root{
    --ink:#16211c; --ink-2:#4a5b52; --ink-3:#7b8a82;
    --panel:#fbfaf7; --line:#d9d5cb; --chrome:#232d28;
    --green:#2f7d4f; --amber:#a8730f; --grey:#6b7671; --red:#a33a2a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
  #app{display:flex;height:100%;overflow:hidden}
  #map{flex:1;min-width:0;position:relative;background:#e8e4da}

  /* ------------------------------------------------------- map controls */
  #views{position:absolute;z-index:5;left:10px;top:10px;background:#fffffff2;
         border:1px solid #b9b4a8;border-radius:6px;padding:8px 10px;
         box-shadow:0 1px 6px rgba(0,0,0,.22);max-width:196px}
  #views h4{margin:0 0 5px;font-size:10px;text-transform:uppercase;
            letter-spacing:.7px;color:var(--ink-3)}
  #views h4+h4,#views h4:not(:first-child){margin-top:9px;padding-top:8px;
            border-top:1px solid var(--line)}
  #views label{display:flex;align-items:center;gap:7px;font-size:12.5px;
               padding:2px 0;cursor:pointer}
  #views input{accent-color:var(--chrome);margin:0}
  .swatch{width:10px;height:10px;border-radius:50%;border:1.5px solid #fff;
          box-shadow:0 0 0 1px rgba(0,0,0,.4);flex:none}

  /* -------------------------------------------------------------- panel */
  #panel{width:370px;flex:none;background:var(--panel);border-left:1px solid var(--line);
         display:flex;flex-direction:column;overflow:hidden}
  #panel header{padding:14px 16px;background:var(--chrome);color:#f2f0ea}
  #panel header h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.2px}
  #panel header p{margin:3px 0 0;font-size:11.5px;color:#9fada6}
  #controls{padding:12px 16px;border-bottom:1px solid var(--line);background:#f4f2ed}
  #controls label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;
                  color:var(--ink-3);margin-bottom:6px;font-weight:600}
  #driveRange{width:100%;accent-color:var(--chrome)}
  #driveLabel{font-weight:600;color:var(--ink);text-transform:none;letter-spacing:0;font-size:13px}
  #body{flex:1;overflow-y:auto;padding:16px}

  .empty{color:var(--ink-3);font-size:13px}
  .empty strong{color:var(--ink);display:block;margin-bottom:6px;font-size:14px}
  h2.peak{margin:0 0 2px;font-size:19px;font-weight:650;line-height:1.2}
  .elev{font-size:13px;color:var(--ink-2);margin:0 0 12px}

  .badge{display:inline-block;padding:3px 9px;border-radius:11px;font-size:11.5px;
         font-weight:600;color:#fff;margin-bottom:12px}
  .badge.public{background:var(--green)} .badge.road_or_easement{background:var(--amber)}
  .badge.not_shown{background:var(--grey)} .badge.unknown{background:var(--red)}
  .badge.open{background:var(--green)} .badge.closed{background:var(--red)}

  .row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line)}
  .row dt{color:var(--ink-3);font-size:12.5px;flex:none}
  .row dd{margin:0;text-align:right;font-weight:600;font-size:13px}
  .row dd small{display:block;font-weight:400;color:var(--ink-3);font-size:11.5px;margin-top:1px}
  .muted{color:var(--ink-3);font-weight:400}

  .sec{margin-top:18px}
  .sec h3{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-3)}
  .note{font-size:12px;color:var(--ink-2);background:#f0eee8;border-left:3px solid var(--line);
        padding:8px 10px;margin-top:10px;border-radius:0 3px 3px 0}
  .note b{color:var(--ink)}
  .src{margin-top:20px;padding-top:12px;border-top:1px solid var(--line);
       font-size:11px;color:var(--ink-3);line-height:1.6}
  .alert{background:#fdf3ec;border:1px solid #e0b894;border-left:4px solid var(--amber);
         border-radius:0 4px 4px 0;padding:10px 12px;margin:0 0 14px;font-size:12.5px;
         color:var(--ink-2)}
  .alert>b{color:#7d4f08;display:block;margin-bottom:6px;font-size:12px;
           text-transform:uppercase;letter-spacing:.5px}
  .alert-item{margin-bottom:8px;line-height:1.45}
  .alert-item b{color:var(--ink);text-transform:none;letter-spacing:0;font-size:12.5px}
  .alert a{color:#7d4f08;font-weight:600}
  .doclink{display:inline-block;margin-top:8px;font-size:12px;font-weight:600}
  .reports{margin-top:8px}
  .report{display:block;padding:7px 0;border-top:1px solid var(--line);
          font-size:12.5px;line-height:1.4;text-decoration:none;color:var(--ink)}
  .report:hover{color:#0b4ea2}
  .report .when{color:var(--ink-3);font-size:11.5px;display:block;margin-top:1px}
  .report .when b{color:var(--ink-2);font-weight:600}
  .report.nearby{opacity:.72}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .chip{background:#eceae3;border:1px solid var(--line);border-radius:10px;
        padding:2px 8px;font-size:11.5px;color:var(--ink-2)}

  .maplibregl-ctrl-attrib{font-size:10.5px}
  @media (max-width:820px){
    #app{flex-direction:column}
    #panel{width:100%;height:52%;border-left:none;border-top:1px solid var(--line)}
    #map{height:48%}
    #views{max-width:152px;padding:6px 8px}
    #views label{font-size:11.5px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="map">
    <div id="views">
      <h4>Base map</h4>
      <label><input type="radio" name="base" value="topo" checked> Topo50</label>
      <label><input type="radio" name="base" value="vector"> Vector topo</label>
      <label><input type="radio" name="base" value="aerial"> Aerial photo</label>
      <h4>View</h4>
      <label><input type="checkbox" id="threeD"> 3D terrain</label>
      <h4>Show</h4>
      <label><input type="checkbox" id="ovPeaks" checked>
        <span class="swatch" style="background:#6b2d3c"></span> Peaks</label>
      <label><input type="checkbox" id="ovRoutes" checked>
        <span class="swatch" style="background:#c8341c"></span> Route to summit</label>
      <label><input type="checkbox" id="ovHuts" checked>
        <span class="swatch" style="background:#1b64c4"></span> DOC huts</label>
      <label><input type="checkbox" id="ovTracks">
        <span class="swatch" style="background:#2f7d4f"></span> All DOC tracks</label>
    </div>
  </div>
  <div id="panel">
    <header>
      <h1>Nelson Peak Map</h1>
      <p id="subtitle">loading…</p>
    </header>
    <div id="controls">
      <label for="driveRange">Show peaks within <span id="driveLabel">any</span> drive</label>
      <input id="driveRange" type="range" min="15" max="240" step="15" value="240">
    </div>
    <div id="body">
      <p class="empty"><strong>Tap a peak or a hut.</strong>
      Bigger, darker circles are higher. Every number comes from a named source,
      and anything that could not be established is left blank rather than
      guessed.</p>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.6.1/maplibre-gl.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════════
//  LINZ API KEY
//  A developer key issued by LINZ Basemaps for this project. Developer keys
//  do not expire and have no request cap. LINZ confirmed it does not need
//  restricting to a site, so it is fine sitting here in a public page.
//  Attribution is a condition of use and is shown in the map corner.
// ═══════════════════════════════════════════════════════════════════════
const LINZ_API_KEY = "d01m0gkkx2t24zn5bcrp0sxk472";

const HOME_KEY = "nelson-peak-map.home";
const STYLE  = `https://basemaps.linz.govt.nz/v1/styles/topographic.json?api=${LINZ_API_KEY}`;
const TOPO   = `https://basemaps.linz.govt.nz/v1/tiles/topo-raster/3857/{z}/{x}/{y}.webp?api=${LINZ_API_KEY}`;
const AERIAL = `https://basemaps.linz.govt.nz/v1/tiles/aerial/3857/{z}/{x}/{y}.webp?api=${LINZ_API_KEY}`;
const FRESH  = { cache: "no-cache" };

// ------------------------------------------------------------------ map
// Built on LINZ's published vector style. That style already carries their
// national elevation model as a terrain source, so 3D costs one line, and a
// style fetched by URL loads far more reliably than an inline one. The two
// raster basemaps are laid over it and switched by visibility.
const map = new maplibregl.Map({
  container: "map", style: STYLE,
  center: [172.9, -41.4], zoom: 8, maxPitch: 80,
  attributionControl: false
});
map.addControl(new maplibregl.AttributionControl({
  compact: true,
  customAttribution:
    '&copy; <a href="https://www.linz.govt.nz/linz-copyright">LINZ CC BY 4.0</a> &middot; ' +
    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &middot; ' +
    'access <a href="https://www.herengaanuku.govt.nz/">Herenga &#257; Nuku</a> &middot; ' +
    'tracks and huts <a href="https://www.doc.govt.nz/">DOC</a>'
}));
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "top-right");
map.addControl(new maplibregl.ScaleControl({ maxWidth: 110 }), "bottom-left");

let vectorLayerIds = [];

// -------------------------------------------------------------- helpers
const R = 6371;
function distKm(a, b, c, d) {
  const t = Math.PI / 180, p1 = a * t, p2 = c * t;
  const dp = (c - a) * t, dl = (d - b) * t;
  const h = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function bearing(a, b, c, d) {
  const t = Math.PI / 180, p1 = a * t, p2 = c * t, dl = (d - b) * t;
  const y = Math.sin(dl) * Math.cos(p2);
  const x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
  return (Math.atan2(y, x) / t + 360) % 360;
}
const POINTS = ["N","NNE","NE","ENE","E","ESE","SE","SSE",
                "S","SSW","SW","WSW","W","WNW","NW","NNW"];
const compass = d => POINTS[Math.round(((d % 360) / 22.5)) % 16];
function hhmm(sec) {
  const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
  return h ? `${h} h ${String(m).padStart(2, "0")} min` : `${m} min`;
}
function hoursMins(sec) {
  const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
  return m ? `${h} h ${m} min` : `${h} h`;
}
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clock = iso => iso.slice(11, 16);

const GRADES = {
  hiking:                     ["Walking track", "Formed and easy to follow."],
  mountain_hiking:            ["Mountain track", "Steep in places. Sure footing needed."],
  demanding_mountain_hiking:  ["Demanding mountain track", "Exposed sections. Hands sometimes needed."],
  alpine_hiking:              ["Alpine route", "Some scrambling. Snow possible."],
  demanding_alpine_hiking:    ["Demanding alpine route", "Serious scrambling and exposure."],
  difficult_alpine_hiking:    ["Difficult alpine route", "Climbing skills required."]
};
const ACCESS = {
  public:           ["Public land", "public"],
  road_or_easement: ["Road or easement only", "road_or_easement"],
  not_shown:        ["Not shown as public land", "not_shown"]
};
const WX = {
  0:"Clear",1:"Mostly clear",2:"Part cloud",3:"Overcast",45:"Fog",48:"Freezing fog",
  51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",56:"Freezing drizzle",
  57:"Freezing drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",66:"Freezing rain",
  67:"Freezing rain",71:"Light snow",73:"Snow",75:"Heavy snow",77:"Snow grains",
  80:"Showers",81:"Showers",82:"Heavy showers",85:"Snow showers",86:"Heavy snow showers",
  95:"Thunderstorm",96:"Thunderstorm, hail",99:"Thunderstorm, hail"
};

let home = null, DATA = null, DOC = null, homeMarker = null;
try { home = JSON.parse(localStorage.getItem(HOME_KEY) || "null"); } catch (e) { home = null; }

const colourFor = m =>
  m >= 1800 ? "#3d1f52" : m >= 1400 ? "#6b2d3c" :
  m >= 1000 ? "#9c4a1e" : m >= 600 ? "#8a6a12" : "#4a6b2a";

// --------------------------------------------------------- base layers
function addBases() {
  map.addSource("topoRaster", { type: "raster", tiles: [TOPO], tileSize: 256, maxzoom: 16 });
  map.addSource("aerialRaster", { type: "raster", tiles: [AERIAL], tileSize: 256, maxzoom: 20 });
  const above = vectorLayerIds[1];
  map.addLayer({ id: "topoRasterLayer", type: "raster", source: "topoRaster" }, above);
  map.addLayer({ id: "aerialRasterLayer", type: "raster", source: "aerialRaster",
                 layout: { visibility: "none" } }, above);
}

function setBase(which) {
  const showVector = which === "vector";
  for (const id of vectorLayerIds) {
    const l = map.getLayer(id);
    if (l && l.type !== "background") {
      map.setLayoutProperty(id, "visibility", showVector ? "visible" : "none");
    }
  }
  map.setLayoutProperty("topoRasterLayer", "visibility", which === "topo" ? "visible" : "none");
  map.setLayoutProperty("aerialRasterLayer", "visibility", which === "aerial" ? "visible" : "none");
}

function set3D(on) {
  if (on) {
    map.setTerrain({ source: "LINZ-Terrain", exaggeration: 1.3 });
    // MapLibre draws sky through setSky, not as a layer. Mapbox uses a layer,
    // and using that here fails silently apart from a console warning.
    map.setSky({
      "sky-color": "#8fb4d8", "horizon-color": "#dfe7ee",
      "fog-color": "#e8eef3", "fog-ground-blend": 0.6,
      "horizon-fog-blend": 0.5, "sky-horizon-blend": 0.6
    });
    if (map.getPitch() < 25) map.easeTo({ pitch: 62, duration: 800 });
  } else {
    map.setTerrain(null);
    map.setSky(null);
    map.easeTo({ pitch: 0, duration: 600 });
  }
}

// ------------------------------------------------------------ overlays
function peakGeoJSON(maxSec) {
  const f = [];
  for (const p of DATA.peaks) {
    const sec = p.drive ? p.drive.seconds : null;
    if (sec === null ? maxSec < 240 * 60 : sec > maxSec) continue;
    f.push({ type: "Feature",
      geometry: { type: "Point", coordinates: [p.lon, p.lat] },
      properties: { id: p.id, name: p.name, ele: p.elevation_m,
                    colour: colourFor(p.elevation_m) } });
  }
  return { type: "FeatureCollection", features: f };
}

function routeGeoJSON(only) {
  const f = [];
  for (const p of DATA.peaks) {
    if (!p.route || !p.route.line || p.route.line.length < 2) continue;
    if (only && p.id !== only) continue;
    f.push({ type: "Feature",
      geometry: { type: "LineString", coordinates: p.route.line.map(([a, b]) => [b, a]) },
      properties: { id: p.id, name: p.name } });
  }
  return { type: "FeatureCollection", features: f };
}

function addOverlays() {
  map.addSource("docTracks", { type: "geojson", data: DOC.tracks });
  map.addLayer({
    id: "docTracksLine", type: "line", source: "docTracks",
    layout: { visibility: "none", "line-cap": "round" },
    paint: { "line-color": "#2f7d4f", "line-width": 1.8, "line-opacity": .8,
             "line-dasharray": [3, 2] }
  });

  map.addSource("routes", { type: "geojson", data: routeGeoJSON() });
  map.addLayer({ id: "routeCasing", type: "line", source: "routes",
    layout: { "line-cap": "round", "line-join": "round" },
    paint: { "line-color": "#ffffff", "line-width": 5.5, "line-opacity": .9 } });
  map.addLayer({ id: "routeLine", type: "line", source: "routes",
    layout: { "line-cap": "round", "line-join": "round" },
    paint: { "line-color": "#c8341c", "line-width": 2.6 } });

  map.addSource("huts", { type: "geojson", data: DOC.huts });
  map.addLayer({
    id: "hutPoints", type: "circle", source: "huts",
    paint: {
      "circle-radius": ["interpolate", ["linear"], ["zoom"], 8, 3.2, 13, 6],
      "circle-color": ["case", ["==", ["get", "status"], "OPEN"], "#1b64c4", "#a33a2a"],
      "circle-stroke-color": "#ffffff", "circle-stroke-width": 1.6
    }
  });
  map.addLayer({
    id: "hutLabels", type: "symbol", source: "huts", minzoom: 11,
    layout: { "text-field": ["get", "name"], "text-size": 11,
              "text-offset": [0, 1.1], "text-anchor": "top",
              "text-font": ["Open Sans Regular"] },
    paint: { "text-color": "#123a6b", "text-halo-color": "#fff", "text-halo-width": 1.6 }
  });

  map.addSource("peaks", { type: "geojson", data: peakGeoJSON(240 * 60) });
  map.addLayer({
    id: "peakPoints", type: "circle", source: "peaks",
    paint: {
      "circle-radius": ["interpolate", ["linear"], ["get", "ele"], 300, 4, 1000, 6.5, 1800, 10],
      "circle-color": ["get", "colour"],
      "circle-stroke-color": "#ffffff", "circle-stroke-width": 1.6
    }
  });
  map.addLayer({
    id: "peakLabels", type: "symbol", source: "peaks", minzoom: 10,
    layout: { "text-field": ["concat", ["get", "name"], "  ", ["get", "ele"], " m"],
              "text-size": 11.5, "text-offset": [0, 1.2], "text-anchor": "top",
              "text-font": ["Open Sans Regular"] },
    paint: { "text-color": "#3a2230", "text-halo-color": "#fff", "text-halo-width": 1.8 }
  });

  if (home) addHome();
}

function addHome() {
  if (homeMarker) homeMarker.remove();
  const el = document.createElement("div");
  el.style.cssText = "width:18px;height:18px;border-radius:50%;background:#1b64c4;" +
    "border:3px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.5)";
  homeMarker = new maplibregl.Marker({ element: el })
    .setLngLat([home.lon, home.lat]).addTo(map);
}

function highlightRoute(id) {
  if (!map.getSource("routes")) return;
  map.getSource("routes").setData(routeGeoJSON(id));
  const p = DATA.peaks.find(x => x.id === id);
  if (p && p.route && p.route.line && p.route.line.length > 1) {
    const b = new maplibregl.LngLatBounds();
    for (const [la, lo] of p.route.line) b.extend([lo, la]);
    map.fitBounds(b, { padding: 60, maxZoom: 14, duration: 900 });
  }
}

// ----------------------------------------------------------- the panel
function row(term, value, sub) {
  return `<div class="row"><dt>${term}</dt><dd>${value}` +
         (sub ? `<small>${sub}</small>` : "") + `</dd></div>`;
}

function profileChart(rt) {
  const pr = rt.profile;
  if (!pr || pr.length < 3) return "";
  const W = 336, H = 96, L_ = 34, B = 16, T = 8;
  const xs = pr.map(d => d[0]), ys = pr.map(d => d[1]);
  const xMax = Math.max(...xs) || 1;
  const yMin = Math.min(...ys), yMax = Math.max(...ys);
  const pad = Math.max(20, (yMax - yMin) * 0.08);
  const lo = Math.max(0, Math.floor((yMin - pad) / 50) * 50);
  const hi = Math.ceil((yMax + pad) / 50) * 50;
  const px = v => L_ + (v / xMax) * (W - L_ - 6);
  const py = v => T + (1 - (v - lo) / ((hi - lo) || 1)) * (H - T - B);
  const d = pr.map((q, i) => `${i ? "L" : "M"}${px(q[0]).toFixed(1)},${py(q[1]).toFixed(1)}`).join("");
  const area = `${d}L${px(xMax).toFixed(1)},${py(lo).toFixed(1)}L${px(0).toFixed(1)},${py(lo).toFixed(1)}Z`;
  const kmMax = xMax / 1000;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img"
       aria-label="Height along the route, ${lo} to ${hi} metres over ${kmMax.toFixed(1)} kilometres"
       style="display:block;margin-top:10px">
    <path d="${area}" fill="#6b2d3c" opacity=".14"></path>
    <path d="${d}" fill="none" stroke="#6b2d3c" stroke-width="1.8"
          stroke-linejoin="round" stroke-linecap="round"></path>
    <line x1="${L_}" y1="${py(lo)}" x2="${W - 6}" y2="${py(lo)}" stroke="#c9c4b8"></line>
    <text x="${L_ - 5}" y="${py(hi) + 4}" text-anchor="end" font-size="9" fill="#7b8a82">${hi}</text>
    <text x="${L_ - 5}" y="${py(lo) + 4}" text-anchor="end" font-size="9" fill="#7b8a82">${lo}</text>
    <text x="${L_}" y="${H - 4}" font-size="9" fill="#7b8a82">0 km</text>
    <text x="${W - 6}" y="${H - 4}" text-anchor="end" font-size="9" fill="#7b8a82">${kmMax.toFixed(1)} km</text>
  </svg>`;
}

function prettyDate(r) {
  if (!r.date) return r.year ? String(r.year) : "date unknown";
  const parts = r.date.split("-");
  const d = new Date(+parts[0], +parts[1] - 1, +(parts[2] || 1));
  return d.toLocaleDateString("en-NZ",
    parts[2] ? { day: "numeric", month: "short", year: "numeric" }
             : { month: "short", year: "numeric" });
}

const naismith = (metres, ascent) =>
  ({ total: (metres * 2) / 5000 * 3600 + ascent / 600 * 3600 });

function showPeak(p) {
  const t = p.track, th = p.trailhead, dr = p.drive, ac = p.access, doc = p.doc;
  let h = `<h2 class="peak">${esc(p.name)}</h2><p class="elev">${p.elevation_m} m</p>`;

  const a = ac ? ACCESS[ac.status] : null;
  h += a ? `<span class="badge ${a[1]}">${a[0]}</span>`
         : `<span class="badge unknown">Access could not be checked</span>`;

  if (doc && doc.alerts && doc.alerts.length) {
    h += `<div class="alert"><b>DOC alert on ${esc(doc.name)}</b>`;
    for (const al of doc.alerts.slice(0, 3)) {
      h += `<div class="alert-item"><b>${esc(al.heading || "Notice")}</b>`
         + (al.date ? ` <span class="muted">${esc(al.date)}</span>` : "")
         + (al.detail ? `<br>${esc(al.detail).slice(0, 320)}` : "") + `</div>`;
    }
    if (doc.link) h += `<a href="${esc(doc.link)}" target="_blank" rel="noopener">Check DOC before you go</a>`;
    h += `</div>`;
  }

  h += `<div class="sec"><h3>Getting there</h3><dl>`;
  if (dr) {
    h += row("Drive", hhmm(dr.seconds), `${(dr.metres / 1000).toFixed(0)} km`);
    h += row("Road end", esc(th.road || "unnamed road"),
             th.metres_from_road > 60
               ? `track starts ${th.metres_from_road} m from the road`
               : "track starts at the road");
  } else {
    h += row("Drive", '<span class="muted">not established</span>',
             "no road link found to this track network");
  }
  if (home) {
    const d = distKm(home.lat, home.lon, p.lat, p.lon);
    const b = bearing(home.lat, home.lon, p.lat, p.lon);
    h += row("From home", `${d.toFixed(1)} km`,
             `${compass(b)}, ${Math.round(b)}&deg;, straight line`);
  }
  h += `</dl>`;
  if (dr && DATA.home_is_placeholder) {
    h += `<div class="note">Drive time is measured from
          <b>${esc(DATA.home_label || "a stand-in point")}</b>, not your house.</div>`;
  }
  h += `</div>`;

  h += `<div class="sec"><h3>The walk in</h3><dl>`;
  if (t.distance_from_trailhead_m != null) {
    h += row("Track distance", `${(t.distance_from_trailhead_m / 1000).toFixed(1)} km`,
             "one way, measured along the track");
  } else {
    h += row("Track distance", '<span class="muted">not established</span>',
             "no continuous track found from a road");
  }
  if (t.name) h += row("Track", esc(t.name));
  const g = GRADES[t.grade];
  h += row("Grade", g ? g[0] : '<span class="muted">not graded</span>',
           g ? g[1] : "no difficulty grade recorded in OpenStreetMap");
  h += `</dl>`;
  if (t.metres_from_summit > 100) {
    h += `<div class="note">The mapped track stops about
          <b>${t.metres_from_summit} m</b> short of the summit. The last part is
          untracked, so treat it as a route, not a path.</div>`;
  }
  h += `</div>`;

  if (doc) {
    h += `<div class="sec"><h3>What DOC says</h3><dl>`;
    h += row("Track", esc(doc.name), doc.location ? esc(doc.location) : null);
    if (doc.walk_duration) h += row("DOC walking time", esc(doc.walk_duration), "their figure, not my estimate");
    if (doc.distance) h += row("DOC distance", esc(doc.distance));
    if (doc.walk_category) h += row("DOC grade", esc(doc.walk_category), "official grading");
    h += `</dl>`;
    if (doc.introduction) h += `<div class="note">${esc(doc.introduction)}</div>`;
    if (doc.others && doc.others.length) {
      h += `<div class="note">DOC lists other tracks past this summit too:
            ${doc.others.map(esc).join(", ")}. I picked the one that looks like
            the route up rather than a longer trip that happens to cross it.</div>`;
    }
    if (doc.link) h += `<a class="doclink" href="${esc(doc.link)}" target="_blank" rel="noopener">Open the DOC page for this track</a>`;
    h += `</div>`;
  }

  // ---- trip reports. Titles and links only, never the text itself.
  if (p.reports && p.reports.length) {
    const about = p.reports.filter(r => r.about);
    const newest = p.reports.reduce((a, r) =>
      (r.year || 0) > (a.year || 0) ? r : a, p.reports[0]);
    h += `<div class="sec"><h3>Trip reports</h3>`;
    const clubs = [...new Set(p.reports.map(r => r.club || "NTC"))];
    h += `<p class="elev" style="margin:0 0 2px">${p.reports.length} report`
       + `${p.reports.length === 1 ? "" : "s"} from ${clubs.length} club`
       + `${clubs.length === 1 ? "" : "s"}`
       + `${newest.year ? `, most recent ${prettyDate(newest)}` : ""}.</p>`;
    h += `<div class="reports">`;
    for (const r of p.reports) {
      h += `<a class="report${r.about ? "" : " nearby"}" target="_blank"
               rel="noopener" href="${esc(r.url)}">${esc(r.title)}
               <span class="when"><b>${esc(r.club || "NTC")}</b> &middot; ${prettyDate(r)}`
         + `${r.about ? "" : " &middot; passed through, not a report of this climb"}</span></a>`;
    }
    h += `</div>`;
    h += `<div class="note">From the <b>Nelson Tramping Club</b> archive, going
          back to 2003, and the <b>Wellington Tramping and Mountaineering
          Club</b>. These are one person's day in one set of conditions, often
          years ago, so read them as experience rather than as fact about the
          track. Matching is by name and by the places a trip was tagged with,
          so the odd title may be somewhere else with a similar name.</div>`;
    h += `</div>`;
  }

  const rt = p.route;
  const noWalk = rt && rt.length_m === 0;
  if (noWalk) {
    const gap = t.metres_from_summit;
    h += `<div class="sec"><h3>The climb</h3><div class="note">` + (gap <= 100
      ? `<b>A road reaches this summit.</b> There is no walk in, so there is no climb to report.`
      : `<b>No walking track leads to this summit.</b> The nearest mapped track
         is a roadside one about ${gap} m away, so getting to the top means
         crossing untracked ground.`) + `</div></div>`;
  } else {
    h += `<div class="sec"><h3>Climb</h3><dl>`;
    if (rt && rt.ascent_m != null) {
      h += row("Total climb", `${rt.ascent_m} m`,
               rt.descent_m > 30 ? `and ${rt.descent_m} m of descent on the way up` : "one way");
      if (rt.trailhead_elevation_m != null) {
        h += row("Road end height", `${rt.trailhead_elevation_m} m`,
                 `the summit is ${p.elevation_m - rt.trailhead_elevation_m} m higher, `
                 + `but the route actually climbs ${rt.ascent_m} m`);
      }
      h += `</dl>${profileChart(rt)}`;
      h += `<div class="note">Measured by walking the mapped track and reading
            the ground height every ${rt.sample_spacing_m} m from the LINZ 8 m
            height model. Rises under ${rt.climb_threshold_m} m are ignored so
            that noise in the model does not inflate the total.</div>`;
    } else {
      h += row("Total climb", '<span class="muted">not established</span>',
               "no continuous track found to measure along") + `</dl>`;
    }
    h += `</div>`;
  }

  if (!noWalk && rt && rt.ascent_m != null && rt.length_m) {
    const est = naismith(rt.length_m, rt.ascent_m);
    const hours = est.total / 3600;
    h += `<div class="sec"><h3>How long</h3><dl>`;
    h += row(doc && doc.walk_duration ? "My estimate" : "Return, moving",
             hoursMins(est.total), "Naismith's rule, return trip, no stops");
    if (doc && doc.walk_duration) h += row("DOC says", esc(doc.walk_duration), "trust this one");
    h += `</dl>`;
    if (hours <= 10) {
      h += `<div class="note">An <b>estimate</b>, not a measurement. Naismith
            allows an hour per 5 km plus an hour per 600 m of climb, for a fit
            walker with no breaks.</div><div id="daylight"></div>`;
    } else {
      h += `<div class="note"><b>This is not a day walk.</b> About
            ${Math.round(hours)} hours of moving time over
            ${(rt.length_m * 2 / 1000).toFixed(0)} km return. Plan it properly
            and file trip intentions at adventuresmart.nz.</div>`;
    }
    h += `</div>`;
  }

  h += `<div class="sec"><h3>Weather at the summit</h3>
        <div id="wx" class="muted" style="font-size:12.5px">loading…</div></div>`;

  let accessLine = "Not checked.";
  if (ac) {
    accessLine = ac.layers && ac.layers.length
      ? `Herenga &#257; Nuku shows this summit on: ${esc(ac.layers.join(", "))}.`
      : "Herenga &#257; Nuku shows no public access area at this summit. That is "
        + "not proof the land is private, only that it is not mapped as public.";
    if (ac.detail) accessLine += ` <span class="muted">${esc(ac.detail)}</span>`;
  }
  h += `<div class="src">
      <b>Access:</b> ${accessLine}<br><br>
      <b>Position and height:</b> OpenStreetMap.<br>
      <b>Track and road:</b> OpenStreetMap.<br>
      <b>Drive time:</b> OSRM routing over OpenStreetMap roads.<br>
      <b>Climb:</b> LINZ NZ 8 m height model, via OpenTopoData.<br>
      <b>Forecast:</b> ECMWF IFS and Open-Meteo.<br>
      <b>Official track, huts and alerts:</b> Department of Conservation.<br>
      <b>Trip reports:</b> Nelson Tramping Club and Wellington TMC,
      titles and links only.<br>
      <b>Map:</b> LINZ Topo50, CC BY 4.0.<br><br>
      ${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}
      &middot; <a href="https://www.topomap.co.nz/NZTopoMap?v=2&ll=${p.lat},${p.lon}"
                 target="_blank" rel="noopener">open on NZ Topo Map</a>
    </div>`;

  const body = document.getElementById("body");
  body.innerHTML = h; body.scrollTop = 0;
  highlightRoute(p.id);
  loadWeather(p);
}

function showHut(pr, lngLat) {
  const open = String(pr.status || "").toUpperCase() === "OPEN";
  let h = `<h2 class="peak">${esc(pr.name)}</h2>`;
  h += `<p class="elev">${esc(pr.category || "DOC hut")}`
     + `${pr.place ? " &middot; " + esc(pr.place) : ""}</p>`;
  h += `<span class="badge ${open ? "open" : "closed"}">${esc(pr.status || "status unknown")}</span>`;
  h += `<div class="sec"><h3>The hut</h3><dl>`;
  if (pr.bunks != null && pr.bunks !== "") h += row("Bunks", esc(pr.bunks));
  if (pr.category) h += row("Category", esc(pr.category));
  h += row("Booking", String(pr.bookable) === "true" ? "Must be booked" : "First come, first served");
  if (pr.road_end) h += row("From the road end", esc(pr.road_end));
  if (home) {
    const d = distKm(home.lat, home.lon, lngLat.lat, lngLat.lng);
    const b = bearing(home.lat, home.lon, lngLat.lat, lngLat.lng);
    h += row("From home", `${d.toFixed(1)} km`, `${compass(b)}, straight line`);
  }
  h += `</dl>`;
  // MapLibre hands array properties back as a JSON string when a feature comes
  // from a click, but as a real array when called directly. Handle both, and
  // never split on commas, because facilities like "Water from tap - not
  // treated, boil before use" contain them.
  let facs = [];
  if (Array.isArray(pr.facilities)) {
    facs = pr.facilities;
  } else if (typeof pr.facilities === "string" && pr.facilities.trim()) {
    try { facs = JSON.parse(pr.facilities); } catch (e) { facs = [pr.facilities]; }
  }
  if (!Array.isArray(facs)) facs = [];
  if (facs.length) {
    h += `<div class="chips">${facs.map(f => `<span class="chip">${esc(f)}</span>`).join("")}</div>`;
  }
  if (pr.introduction) h += `<div class="note">${esc(pr.introduction)}</div>`;
  if (pr.link) h += `<a class="doclink" href="${esc(pr.link)}" target="_blank" rel="noopener">Open the DOC page for this hut</a>`;
  h += `</div><div class="src"><b>Source:</b> Department of Conservation huts API.<br>
        ${lngLat.lat.toFixed(5)}, ${lngLat.lng.toFixed(5)}</div>`;
  const body = document.getElementById("body");
  body.innerHTML = h; body.scrollTop = 0;
}

// ----------------------------------------------------------------- weather
function loadWeather(p) {
  const box = document.getElementById("wx");
  if (!box) return;
  const base = `https://api.open-meteo.com/v1/forecast?latitude=${p.lat}`
    + `&longitude=${p.lon}&elevation=${p.elevation_m}`
    + `&timezone=Pacific%2FAuckland&forecast_days=3`;
  Promise.all([
    fetch(base + "&models=ecmwf_ifs025&daily=weather_code,temperature_2m_max,"
        + "temperature_2m_min,precipitation_sum,wind_speed_10m_max,"
        + "wind_gusts_10m_max,wind_direction_10m_dominant,sunrise,sunset").then(r => r.json()),
    fetch(base + "&hourly=freezing_level_height").then(r => r.json())
  ]).then(([w, f]) => renderWeather(box, p, w, f))
    .catch(() => { box.innerHTML = `<span class="muted">Could not reach the forecast service.</span>`; });
}

function renderWeather(box, p, w, f) {
  const d = w.daily;
  if (!d || !d.time) { box.textContent = "No forecast available."; return; }
  const frzFor = day => {
    if (!f.hourly || !f.hourly.time) return null;
    const v = f.hourly.time.map((t, i) =>
      t.startsWith(day) ? f.hourly.freezing_level_height[i] : null).filter(x => x != null);
    return v.length ? [Math.min(...v), Math.max(...v)] : null;
  };
  let h = `<dl>`;
  for (let i = 0; i < d.time.length; i++) {
    const day = new Date(d.time[i] + "T12:00:00")
      .toLocaleDateString("en-NZ", { weekday: "short", day: "numeric", month: "short" });
    const frz = frzFor(d.time[i]);
    const bits = [
      `${Math.round(d.temperature_2m_min[i])} to ${Math.round(d.temperature_2m_max[i])}&deg;C`,
      `${d.precipitation_sum[i].toFixed(1)} mm`,
      `wind ${Math.round(d.wind_speed_10m_max[i])}, gusts ${Math.round(d.wind_gusts_10m_max[i])} km/h`
    ];
    if (frz) bits.push(`freezing level ${Math.round(frz[0])} to ${Math.round(frz[1])} m`
      + ` &middot; summit ${p.elevation_m} m`);
    h += row(day, esc(WX[d.weather_code[i]] || "?"), bits.join("<br>"));
  }
  h += `</dl><div class="note">Forecast for ${p.elevation_m} m, not for the nearest
        town. Temperature, rain and wind from <b>ECMWF IFS</b>. Freezing level from
        Open-Meteo's multi-model blend, because ECMWF does not publish it here.
        A forecast is not a promise.
        <a href="https://www.yr.no/en/forecast/daily-table/${p.lat},${p.lon}"
           target="_blank" rel="noopener">Open this spot on yr.no</a>.</div>`;
  box.innerHTML = h;

  const dl = document.getElementById("daylight");
  if (dl && d.sunrise && d.sunset && p.route && p.route.ascent_m != null) {
    const t = naismith(p.route.length_m, p.route.ascent_m);
    const latest = new Date(new Date(d.sunset[0]).getTime() - t.total * 1000);
    dl.innerHTML = `<dl>`
      + row("Light today", `${clock(d.sunrise[0])} to ${clock(d.sunset[0])}`,
            "sunrise and sunset at this summit")
      + row("Latest start", latest.toTimeString().slice(0, 5),
            "to be back at the car by dark, moving without stops")
      + `</dl>`;
  }
}

// ---------------------------------------------------------------- wiring
const range = document.getElementById("driveRange");
range.oninput = () => {
  const v = +range.value;
  document.getElementById("driveLabel").textContent =
    v >= 240 ? "any" : (v >= 60 ? `${(v / 60).toFixed(v % 60 ? 1 : 0)} hour${v > 60 ? "s" : ""}` : `${v} min`);
  if (DATA && map.getSource("peaks")) {
    const gj = peakGeoJSON(v * 60);
    map.getSource("peaks").setData(gj);
    document.getElementById("subtitle").textContent =
      `${gj.features.length} peaks · ${DOC ? DOC.huts.features.length : 0} huts · `
      + `${DATA.counts.named_peaks_in_region} named peaks in the region`;
  }
};
for (const r of document.querySelectorAll('input[name="base"]')) {
  r.onchange = () => setBase(r.value);
}
document.getElementById("threeD").onchange = e => set3D(e.target.checked);
const vis = (id, on) => map.getLayer(id) &&
  map.setLayoutProperty(id, "visibility", on ? "visible" : "none");
document.getElementById("ovPeaks").onchange  = e => { vis("peakPoints", e.target.checked); vis("peakLabels", e.target.checked); };
document.getElementById("ovRoutes").onchange = e => { vis("routeCasing", e.target.checked); vis("routeLine", e.target.checked); };
document.getElementById("ovHuts").onchange   = e => { vis("hutPoints", e.target.checked); vis("hutLabels", e.target.checked); };
document.getElementById("ovTracks").onchange = e => vis("docTracksLine", e.target.checked);

// ------------------------------------------------------------------ load
map.on("style.load", async () => {
  vectorLayerIds = map.getStyle().layers.map(l => l.id);
  addBases();
  setBase("topo");

  const homeFile = await fetch("data/home.local.json", FRESH)
    .then(r => r.ok ? r.json() : null).catch(() => null);
  if (homeFile && typeof homeFile.lat === "number") {
    home = { lat: homeFile.lat, lon: homeFile.lon };
  }

  DATA = await fetch("data/peaks.json", FRESH)
    .then(r => r.ok ? r : fetch("data/peaks.public.json", FRESH))
    .then(r => r.json());
  DOC = await fetch("data/doc_layers.json", FRESH).then(r => r.json())
    .catch(() => ({ huts: { type: "FeatureCollection", features: [] },
                    tracks: { type: "FeatureCollection", features: [] } }));

  addOverlays();
  range.dispatchEvent(new Event("input"));
  if (home) map.jumpTo({ center: [home.lon, home.lat], zoom: 9.5 });

  for (const id of ["peakPoints", "hutPoints"]) {
    map.on("mouseenter", id, () => map.getCanvas().style.cursor = "pointer");
    map.on("mouseleave", id, () => map.getCanvas().style.cursor = "");
  }
  map.on("click", "peakPoints", e => {
    const p = DATA.peaks.find(x => x.id === e.features[0].properties.id);
    if (p) showPeak(p);
  });
  map.on("click", "hutPoints", e => showHut(e.features[0].properties, e.lngLat));
});
</script>
