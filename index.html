<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Nelson Peak Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --ink:#16211c; --ink-2:#4a5b52; --ink-3:#7b8a82;
    --panel:#fbfaf7; --line:#d9d5cb; --chrome:#232d28;
    --green:#2f7d4f; --amber:#a8730f; --grey:#6b7671; --red:#a33a2a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
  #app{display:flex;height:100%;overflow:hidden}
  #map{flex:1;min-width:0;background:#e8e4da}

  /* ---------------------------------------------------------- panel */
  #panel{width:370px;flex:none;background:var(--panel);border-left:1px solid var(--line);
         display:flex;flex-direction:column;overflow:hidden}
  #panel header{padding:14px 16px;background:var(--chrome);color:#f2f0ea}
  #panel header h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.2px}
  #panel header p{margin:3px 0 0;font-size:11.5px;color:#9fada6}
  #controls{padding:12px 16px;border-bottom:1px solid var(--line);background:#f4f2ed}
  #controls label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;
                  color:var(--ink-3);margin-bottom:6px;font-weight:600}
  #driveRange{width:100%;accent-color:var(--chrome)}
  #driveLabel{font-weight:600;color:var(--ink);text-transform:none;letter-spacing:0;font-size:13px}
  #body{flex:1;overflow-y:auto;padding:16px}

  .empty{color:var(--ink-3);font-size:13px}
  .empty strong{color:var(--ink);display:block;margin-bottom:6px;font-size:14px}

  h2.peak{margin:0 0 2px;font-size:19px;font-weight:650;line-height:1.2}
  .elev{font-size:13px;color:var(--ink-2);margin:0 0 12px}

  .badge{display:inline-block;padding:3px 9px;border-radius:11px;font-size:11.5px;
         font-weight:600;color:#fff;margin-bottom:12px}
  .badge.public{background:var(--green)} .badge.road_or_easement{background:var(--amber)}
  .badge.not_shown{background:var(--grey)} .badge.unknown{background:var(--red)}

  .row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line)}
  .row dt{color:var(--ink-3);font-size:12.5px;flex:none}
  .row dd{margin:0;text-align:right;font-weight:600;font-size:13px}
  .row dd small{display:block;font-weight:400;color:var(--ink-3);font-size:11.5px;margin-top:1px}
  .muted{color:var(--ink-3);font-weight:400}

  .sec{margin-top:18px}
  .sec h3{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-3)}
  .note{font-size:12px;color:var(--ink-2);background:#f0eee8;border-left:3px solid var(--line);
        padding:8px 10px;margin-top:10px;border-radius:0 3px 3px 0}
  .note b{color:var(--ink)}
  .src{margin-top:20px;padding-top:12px;border-top:1px solid var(--line);
       font-size:11px;color:var(--ink-3);line-height:1.6}

  /* ---------------------------------------------------------- markers */
  .pk{border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.45)}
  .home-pin{width:18px;height:18px;border-radius:50%;background:#1b64c4;
            border:3px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.5)}
  .leaflet-container{font:inherit}
  .leaflet-control-attribution{font-size:10.5px}

  #setHome{position:absolute;z-index:1000;left:12px;bottom:26px;background:#fff;border:1px solid #b9b4a8;
           border-radius:5px;padding:7px 11px;font:600 12px/1 inherit;cursor:pointer;
           box-shadow:0 1px 4px rgba(0,0,0,.25)}
  #setHome.arming{background:#1b64c4;color:#fff;border-color:#1b64c4}

  @media (max-width:820px){
    #app{flex-direction:column}
    #panel{width:100%;height:52%;border-left:none;border-top:1px solid var(--line)}
    #map{height:48%}
  }
</style>
</head>
<body>
<div id="app">
  <div id="map"><button id="setHome" type="button">Set my home</button></div>
  <div id="panel">
    <header>
      <h1>Nelson Peak Map</h1>
      <p id="subtitle">loading…</p>
    </header>
    <div id="controls">
      <label for="driveRange">Show peaks within <span id="driveLabel">4 hours</span> drive</label>
      <input id="driveRange" type="range" min="15" max="240" step="15" value="240">
    </div>
    <div id="body">
      <p class="empty"><strong>Click a peak on the map.</strong>
      Bigger, darker circles are higher. Every number in the panel comes from a
      named source, and anything that could not be established is left blank
      rather than guessed.</p>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════════
//  LINZ API KEY
//  This is the public key from LINZ's own documentation. It works, but
//  keys of this kind expire every 90 days. When LINZ sends you your own
//  developer key, paste it here. That is the only change needed.
// ═══════════════════════════════════════════════════════════════════════
const LINZ_API_KEY = "d01eerf7nz5n1cxad3tqy91d0sa";

const HOME_KEY = "nelson-peak-map.home";
const LINZ_CREDIT =
  '&copy; <a href="https://www.linz.govt.nz/linz-copyright">LINZ CC BY 4.0</a>';

// ------------------------------------------------------------------ map
const map = L.map("map", { center: [-41.4, 172.9], zoom: 9, zoomControl: true });

function linzLayer(tileset) {
  return L.tileLayer(
    `https://basemaps.linz.govt.nz/v1/tiles/${tileset}/3857/{z}/{x}/{y}.webp?api=${LINZ_API_KEY}`,
    { maxZoom: 16, minZoom: 5, attribution: LINZ_CREDIT }
  );
}
const topo = linzLayer("topo-raster").addTo(map);
const aerial = linzLayer("aerial");
L.control.layers({ "LINZ topo": topo, "Aerial photo": aerial }, null,
                 { position: "topright" }).addTo(map);

// Leaflet caches the map's pixel size. If the window is resized, the phone is
// rotated, or the tab is hidden and comes back, that cached size goes stale and
// the map draws into a small box in the middle. Watching the container and
// re-measuring keeps it filling the space.
new ResizeObserver(() => map.invalidateSize({ animate: false }))
  .observe(document.getElementById("map"));
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) map.invalidateSize({ animate: false });
});

// -------------------------------------------------------------- helpers
const R = 6371;
function distKm(a, b, c, d) {
  const t = Math.PI / 180, p1 = a * t, p2 = c * t;
  const dp = (c - a) * t, dl = (d - b) * t;
  const h = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function bearing(a, b, c, d) {
  const t = Math.PI / 180, p1 = a * t, p2 = c * t, dl = (d - b) * t;
  const y = Math.sin(dl) * Math.cos(p2);
  const x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
  return (Math.atan2(y, x) / t + 360) % 360;
}
const POINTS = ["N","NNE","NE","ENE","E","ESE","SE","SSE",
                "S","SSW","SW","WSW","W","WNW","NW","NNW"];
const compass = d => POINTS[Math.round(((d % 360) / 22.5)) % 16];

function hhmm(sec) {
  const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
  return h ? `${h} h ${String(m).padStart(2, "0")} min` : `${m} min`;
}
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// OSM's sac_scale, in words rather than jargon.
const GRADES = {
  hiking:                     ["Walking track", "Formed and easy to follow."],
  mountain_hiking:            ["Mountain track", "Steep in places. Sure footing needed."],
  demanding_mountain_hiking:  ["Demanding mountain track", "Exposed sections. Hands sometimes needed."],
  alpine_hiking:              ["Alpine route", "Some scrambling. Snow possible."],
  demanding_alpine_hiking:    ["Demanding alpine route", "Serious scrambling and exposure."],
  difficult_alpine_hiking:    ["Difficult alpine route", "Climbing skills required."]
};
const ACCESS = {
  public:           ["Public land", "public"],
  road_or_easement: ["Road or easement only", "road_or_easement"],
  not_shown:        ["Not shown as public land", "not_shown"]
};

// --------------------------------------------------------------- home
// Two ways to know where home is, in priority order:
//   1. data/home.local.json, written by the build script. This is the same
//      point the drive times were measured from, so the panel stays honest.
//   2. A pin you drop yourself, kept in this browser only.
// Neither ever reaches data/peaks.json.
let home = null, homeFromFile = false;
try { home = JSON.parse(localStorage.getItem(HOME_KEY) || "null"); } catch (e) { home = null; }
let homeMarker = null, arming = false;

function drawHome() {
  if (homeMarker) { map.removeLayer(homeMarker); homeMarker = null; }
  if (!home) return;
  homeMarker = L.marker([home.lat, home.lon], {
    icon: L.divIcon({ className: "", html: '<div class="home-pin"></div>',
                      iconSize: [18, 18], iconAnchor: [9, 9] }),
    title: "Your home", zIndexOffset: 1000
  }).addTo(map).bindTooltip("Home", { direction: "top" });
}
const setHomeBtn = document.getElementById("setHome");
setHomeBtn.onclick = () => {
  arming = !arming;
  setHomeBtn.classList.toggle("arming", arming);
  setHomeBtn.textContent = arming ? "Click the map on your house" : "Set my home";
};
map.on("click", e => {
  if (!arming) return;
  home = { lat: +e.latlng.lat.toFixed(5), lon: +e.latlng.lng.toFixed(5) };
  localStorage.setItem(HOME_KEY, JSON.stringify(home));   // stays in this browser
  arming = false;
  setHomeBtn.classList.remove("arming");
  setHomeBtn.textContent = "Move my home";
  drawHome();
  if (selected) show(selected);
});
drawHome();
if (home) setHomeBtn.textContent = "Move my home";

// -------------------------------------------------------------- render
let DATA = null, selected = null;
const layer = L.layerGroup().addTo(map);
const markers = new Map();

function colourFor(m) {
  if (m >= 1800) return "#3d1f52";
  if (m >= 1400) return "#6b2d3c";
  if (m >= 1000) return "#9c4a1e";
  if (m >= 600)  return "#8a6a12";
  return "#4a6b2a";
}
const radiusFor = m => 4 + Math.min(7, m / 300);

function draw() {
  layer.clearLayers();
  markers.clear();
  const maxSec = +document.getElementById("driveRange").value * 60;
  let shown = 0;

  for (const p of DATA.peaks) {
    const sec = p.drive ? p.drive.seconds : null;
    // Peaks with no known drive time are only shown when the filter is wide open.
    if (sec === null ? maxSec < 240 * 60 : sec > maxSec) continue;
    shown++;
    const m = L.circleMarker([p.lat, p.lon], {
      radius: radiusFor(p.elevation_m), className: "pk",
      color: "#fff", weight: 1.5, opacity: 1,
      fillColor: colourFor(p.elevation_m), fillOpacity: .92
    }).addTo(layer);
    m.bindTooltip(`${p.name} · ${p.elevation_m} m`, { direction: "top" });
    m.on("click", () => { selected = p; show(p); });
    markers.set(p.id, m);
  }
  document.getElementById("subtitle").textContent =
    `${shown} peaks shown · ${DATA.counts.named_peaks_in_region} named peaks in the region`;
}

function row(term, value, sub) {
  return `<div class="row"><dt>${term}</dt><dd>${value}` +
         (sub ? `<small>${sub}</small>` : "") + `</dd></div>`;
}

// ------------------------------------------------------- the route on the map
const routeLayer = L.layerGroup().addTo(map);

function drawRoute(p) {
  routeLayer.clearLayers();
  const rt = p.route;
  if (!rt || !rt.line || rt.line.length < 2) return;
  // A pale casing under a bright line, so it reads over a busy topo map.
  L.polyline(rt.line, { color: "#fff", weight: 6, opacity: .85 }).addTo(routeLayer);
  L.polyline(rt.line, { color: "#c8341c", weight: 3, opacity: .95 }).addTo(routeLayer);
  if (p.trailhead) {
    L.circleMarker([p.trailhead.lat, p.trailhead.lon], {
      radius: 6, color: "#fff", weight: 2, fillColor: "#1b64c4", fillOpacity: 1
    }).addTo(routeLayer).bindTooltip("Road end", { direction: "top" });
  }
  map.fitBounds(L.polyline(rt.line).getBounds(), { padding: [30, 30], maxZoom: 14 });
}

// ------------------------------------------------------------ height profile
function profileChart(rt) {
  const pr = rt.profile;
  if (!pr || pr.length < 3) return "";
  const W = 336, H = 96, L_ = 34, B = 16, T = 8;
  const xs = pr.map(d => d[0]), ys = pr.map(d => d[1]);
  const xMax = Math.max(...xs) || 1;
  const yMin = Math.min(...ys), yMax = Math.max(...ys);
  const pad = Math.max(20, (yMax - yMin) * 0.08);
  const lo = Math.max(0, Math.floor((yMin - pad) / 50) * 50);
  const hi = Math.ceil((yMax + pad) / 50) * 50;
  const px = v => L_ + (v / xMax) * (W - L_ - 6);
  const py = v => T + (1 - (v - lo) / ((hi - lo) || 1)) * (H - T - B);
  const d = pr.map((q, i) => `${i ? "L" : "M"}${px(q[0]).toFixed(1)},${py(q[1]).toFixed(1)}`).join("");
  const area = `${d}L${px(xMax).toFixed(1)},${py(lo).toFixed(1)}L${px(0).toFixed(1)},${py(lo).toFixed(1)}Z`;
  const kmMax = xMax / 1000;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img"
       aria-label="Height along the route, ${lo} to ${hi} metres over ${kmMax.toFixed(1)} kilometres"
       style="display:block;margin-top:10px">
    <path d="${area}" fill="#6b2d3c" opacity=".14"></path>
    <path d="${d}" fill="none" stroke="#6b2d3c" stroke-width="1.8"
          stroke-linejoin="round" stroke-linecap="round"></path>
    <line x1="${L_}" y1="${py(lo)}" x2="${W - 6}" y2="${py(lo)}" stroke="#c9c4b8"></line>
    <text x="${L_ - 5}" y="${py(hi) + 4}" text-anchor="end" font-size="9" fill="#7b8a82">${hi}</text>
    <text x="${L_ - 5}" y="${py(lo) + 4}" text-anchor="end" font-size="9" fill="#7b8a82">${lo}</text>
    <text x="${L_}" y="${H - 4}" font-size="9" fill="#7b8a82">0 km</text>
    <text x="${W - 6}" y="${H - 4}" text-anchor="end" font-size="9" fill="#7b8a82">${kmMax.toFixed(1)} km</text>
  </svg>`;
}

// ------------------------------------------------------------- time estimate
function naismith(metres, ascent) {
  // Classic rule: an hour per 5 km, plus an hour per 600 m of climb.
  // Applied to the round trip, with the climb counted once.
  const flat = (metres * 2) / 5000 * 3600;
  const up = ascent / 600 * 3600;
  return { total: flat + up };
}
function hoursMins(sec) {
  const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
  return m ? `${h} h ${m} min` : `${h} h`;
}
const clock = iso => iso.slice(11, 16);

// ----------------------------------------------------------------- weather
// WMO weather codes, in plain words.
const WX = {
  0: "Clear", 1: "Mostly clear", 2: "Part cloud", 3: "Overcast",
  45: "Fog", 48: "Freezing fog", 51: "Light drizzle", 53: "Drizzle",
  55: "Heavy drizzle", 56: "Freezing drizzle", 57: "Freezing drizzle",
  61: "Light rain", 63: "Rain", 65: "Heavy rain",
  66: "Freezing rain", 67: "Freezing rain",
  71: "Light snow", 73: "Snow", 75: "Heavy snow", 77: "Snow grains",
  80: "Showers", 81: "Showers", 82: "Heavy showers",
  85: "Snow showers", 86: "Heavy snow showers",
  95: "Thunderstorm", 96: "Thunderstorm, hail", 99: "Thunderstorm, hail"
};

function loadWeather(p) {
  const box = document.getElementById("wx");
  if (!box) return;
  const base = `https://api.open-meteo.com/v1/forecast?latitude=${p.lat}`
    + `&longitude=${p.lon}&elevation=${p.elevation_m}`
    + `&timezone=Pacific%2FAuckland&forecast_days=3`;
  Promise.all([
    // ECMWF IFS for the numbers. It does not carry freezing level.
    fetch(base + "&models=ecmwf_ifs025&daily=weather_code,temperature_2m_max,"
        + "temperature_2m_min,precipitation_sum,wind_speed_10m_max,"
        + "wind_gusts_10m_max,wind_direction_10m_dominant,sunrise,sunset")
      .then(r => r.json()),
    // The multi-model blend, used only for freezing level.
    fetch(base + "&hourly=freezing_level_height").then(r => r.json())
  ]).then(([w, f]) => renderWeather(box, p, w, f))
    .catch(() => {
      box.innerHTML = `<span class="muted">Could not reach the forecast service.
        You are probably offline.</span>`;
    });
}

function renderWeather(box, p, w, f) {
  const d = w.daily;
  if (!d || !d.time) { box.textContent = "No forecast available."; return; }

  const frzFor = day => {
    if (!f.hourly || !f.hourly.time) return null;
    const v = f.hourly.time
      .map((t, i) => t.startsWith(day) ? f.hourly.freezing_level_height[i] : null)
      .filter(x => x != null);
    return v.length ? [Math.min(...v), Math.max(...v)] : null;
  };

  let h = `<dl>`;
  for (let i = 0; i < d.time.length; i++) {
    const day = new Date(d.time[i] + "T12:00:00")
      .toLocaleDateString("en-NZ", { weekday: "short", day: "numeric", month: "short" });
    const frz = frzFor(d.time[i]);
    const bits = [
      `${Math.round(d.temperature_2m_min[i])} to ${Math.round(d.temperature_2m_max[i])}&deg;C`,
      `${d.precipitation_sum[i].toFixed(1)} mm`,
      `wind ${Math.round(d.wind_speed_10m_max[i])}, gusts ${Math.round(d.wind_gusts_10m_max[i])} km/h`
    ];
    if (frz) {
      bits.push(`freezing level ${Math.round(frz[0])} to ${Math.round(frz[1])} m`
        + ` &middot; summit ${p.elevation_m} m`);
    }
    h += row(day, esc(WX[d.weather_code[i]] || "?"), bits.join("<br>"));
  }
  h += `</dl>`;
  h += `<div class="note">Forecast for ${p.elevation_m} m, not for the nearest
        town. Temperature, rain and wind from <b>ECMWF IFS</b>. Freezing level
        from Open-Meteo's multi-model blend, because ECMWF does not publish it
        here. A forecast is not a promise.
        <a href="https://www.yr.no/en/forecast/daily-table/${p.lat},${p.lon}"
           target="_blank" rel="noopener">Open this spot on yr.no</a>.</div>`;
  box.innerHTML = h;

  // Daylight, now that we know sunrise and sunset for this exact spot.
  const dl = document.getElementById("daylight");
  if (dl && d.sunrise && d.sunset && p.route && p.route.ascent_m != null) {
    const t = naismith(p.route.length_m, p.route.ascent_m);
    const set = new Date(d.sunset[0]);
    const latest = new Date(set.getTime() - t.total * 1000);
    const rise = clock(d.sunrise[0]);
    dl.innerHTML = `<dl>`
      + row("Light today", `${rise} to ${clock(d.sunset[0])}`,
            "sunrise and sunset at this summit")
      + row("Latest start", latest.toTimeString().slice(0, 5),
            "to be back at the car by dark, moving without stops")
      + `</dl>`;
  }
}

function show(p) {
  const t = p.track, th = p.trailhead, dr = p.drive, ac = p.access;
  let h = `<h2 class="peak">${esc(p.name)}</h2>
           <p class="elev">${p.elevation_m} m</p>`;

  // ---- access, first, because it decides whether the rest matters
  const a = ac ? ACCESS[ac.status] : null;
  h += a ? `<span class="badge ${a[1]}">${a[0]}</span>`
         : `<span class="badge unknown">Access could not be checked</span>`;

  // ---- getting there
  h += `<div class="sec"><h3>Getting there</h3><dl>`;
  if (dr) {
    h += row("Drive", hhmm(dr.seconds), `${(dr.metres / 1000).toFixed(0)} km`);
    h += row("Road end", esc(th.road || "unnamed road"),
             th.metres_from_road > 60
               ? `track starts ${th.metres_from_road} m from the road`
               : "track starts at the road");
  } else {
    h += row("Drive", '<span class="muted">not established</span>',
             "no road link found to this track network");
  }
  if (home) {
    const d = distKm(home.lat, home.lon, p.lat, p.lon);
    const b = bearing(home.lat, home.lon, p.lat, p.lon);
    h += row("From home", `${d.toFixed(1)} km`,
             `${compass(b)}, ${Math.round(b)}&deg;, straight line`);
  }
  h += `</dl>`;
  if (dr && DATA.home_is_placeholder) {
    h += `<div class="note">Drive time is measured from
          <b>${esc(DATA.home_label || "a stand-in point")}</b>, not your house.
          To make it exact, put your coordinates in <b>home.local.json</b> and
          run the build script again.</div>`;
  }
  h += `</div>`;

  // ---- the walk
  h += `<div class="sec"><h3>The walk in</h3><dl>`;
  if (t.distance_from_trailhead_m != null) {
    h += row("Track distance", `${(t.distance_from_trailhead_m / 1000).toFixed(1)} km`,
             "one way, measured along the track");
  } else {
    h += row("Track distance", '<span class="muted">not established</span>',
             "no continuous track found from a road");
  }
  if (t.name) h += row("Track", esc(t.name));
  const g = GRADES[t.grade];
  h += row("Grade", g ? g[0] : '<span class="muted">not graded</span>',
           g ? g[1] : "no difficulty grade recorded in OpenStreetMap");
  if (t.metres_from_summit > 100) {
    h += `</dl><div class="note">The mapped track stops about
          <b>${t.metres_from_summit} m</b> short of the summit. The last part is
          untracked, so treat it as a route, not a path.</div><dl>`;
  }
  h += `</dl></div>`;

  // ---- climb, measured along the actual route
  const rt = p.route;
  const noWalk = rt && rt.length_m === 0;

  if (noWalk) {
    // The nearest track point to the summit is itself the road access point.
    // Either the road goes to the top, or nothing walkable heads that way.
    const gap = t.metres_from_summit;
    h += `<div class="sec"><h3>The climb</h3><div class="note">` + (gap <= 100
      ? `<b>A road reaches this summit.</b> There is no walk in, so there is no
         climb to report.`
      : `<b>No walking track leads to this summit.</b> The nearest mapped track
         is a roadside one about ${gap} m away, so getting to the top means
         crossing untracked ground. No climb figure is given, because there is
         no route to measure along.`)
      + `</div></div>`;
  } else {
    h += `<div class="sec"><h3>Climb</h3><dl>`;
    if (rt && rt.ascent_m != null) {
      h += row("Total climb", `${rt.ascent_m} m`,
               rt.descent_m > 30 ? `and ${rt.descent_m} m of descent on the way up`
                                 : "one way");
      if (rt.trailhead_elevation_m != null) {
        const naive = p.elevation_m - rt.trailhead_elevation_m;
        h += row("Road end height", `${rt.trailhead_elevation_m} m`,
                 `the summit is ${naive} m higher, but the route actually `
                 + `climbs ${rt.ascent_m} m`);
      }
      h += `</dl>${profileChart(rt)}`;
      h += `<div class="note">Measured by walking the mapped track and reading
            the ground height every ${rt.sample_spacing_m} m from the LINZ 8 m
            height model. Rises under ${rt.climb_threshold_m} m are ignored so
            that noise in the model does not inflate the total.</div>`;
    } else {
      h += row("Total climb", '<span class="muted">not established</span>',
               "no continuous track found to measure along") + `</dl>`;
    }
    h += `</div>`;
  }

  // ---- how long it might take
  if (!noWalk && rt && rt.ascent_m != null && rt.length_m) {
    const est = naismith(rt.length_m, rt.ascent_m);
    const hours = est.total / 3600;
    const dayTrip = hours <= 10;
    h += `<div class="sec"><h3>How long</h3><dl>`;
    h += row("Return, moving", hoursMins(est.total), "Naismith's rule, no stops");
    h += `</dl>`;
    if (dayTrip) {
      h += `<div class="note">An <b>estimate</b>, not a measurement. Naismith
            allows an hour per 5 km plus an hour per 600 m of climb. It assumes
            a fit walker, good conditions and no breaks. Add your own time for
            lunch, photos, and anything technical near the top.</div>
            <div id="daylight"></div>`;
    } else {
      h += `<div class="note"><b>This is not a day walk.</b> At roughly
            ${Math.round(hours)} hours of moving time over
            ${(rt.length_m * 2 / 1000).toFixed(0)} km return, it is a trip of
            several days with nights in huts or a tent. No start time is
            suggested, because getting back before dark is not the question.
            Plan it properly and file trip intentions at adventuresmart.nz.</div>`;
    }
    h += `</div>`;
  }

  // ---- weather, filled in once it arrives
  h += `<div class="sec"><h3>Weather at the summit</h3>
        <div id="wx" class="muted" style="font-size:12.5px">loading…</div></div>`;

  // ---- where the facts came from
  let accessLine = "Not checked.";
  if (ac) {
    accessLine = ac.layers && ac.layers.length
      ? `Herenga &#257; Nuku shows this summit on: ${esc(ac.layers.join(", "))}.`
      : "Herenga &#257; Nuku shows no public access area at this summit. " +
        "That is not proof the land is private, only that it is not mapped as public. Check before you go.";
    if (ac.detail) accessLine += ` <span class="muted">${esc(ac.detail)}</span>`;
  }
  h += `<div class="src">
      <b>Access:</b> ${accessLine}<br><br>
      <b>Position and height:</b> OpenStreetMap.<br>
      <b>Track and road:</b> OpenStreetMap.<br>
      <b>Drive time:</b> OSRM routing over OpenStreetMap roads.<br>
      <b>Climb:</b> LINZ NZ 8 m height model, via OpenTopoData.<br>
      <b>Forecast:</b> ECMWF IFS and Open-Meteo.<br>
      <b>Map:</b> LINZ Topo50, CC BY 4.0.<br><br>
      ${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}
      &middot; <a href="https://www.topomap.co.nz/NZTopoMap?v=2&ll=${p.lat},${p.lon}&z=15"
                 target="_blank" rel="noopener">open on NZ Topo Map</a>
    </div>`;

  document.getElementById("body").innerHTML = h;
  document.getElementById("body").scrollTop = 0;
  drawRoute(p);
  loadWeather(p);
}

// ------------------------------------------------------------- controls
const range = document.getElementById("driveRange");
range.oninput = () => {
  const v = +range.value;
  document.getElementById("driveLabel").textContent =
    v >= 240 ? "any" : (v >= 60 ? `${(v / 60).toFixed(v % 60 ? 1 : 0)} hour${v > 60 ? "s" : ""}` : `${v} min`);
  if (DATA) draw();
};

// ---------------------------------------------------------------- load
// `no-cache` means "ask the server if this changed" rather than "never cache".
// Without it a rebuilt data file can sit unseen behind a stale browser copy.
const FRESH = { cache: "no-cache" };

fetch("data/home.local.json", FRESH)
  .then(r => r.ok ? r.json() : null)
  .catch(() => null)
  .then(h => {
    if (h && typeof h.lat === "number") {
      home = { lat: h.lat, lon: h.lon };
      homeFromFile = true;
      drawHome();
      setHomeBtn.hidden = true;      // the file is the single source of truth
    }
  })
  // Your own build first. On the published copy that file is absent, so the
  // page falls back to the public one, whose drive times start from Nelson
  // city centre rather than your door.
  .then(() => fetch("data/peaks.json", FRESH))
  .then(r => r.ok ? r : fetch("data/peaks.public.json", FRESH))
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    DATA = d;
    range.dispatchEvent(new Event("input"));
    draw();
    // Ground zero really is the centre of the map.
    if (homeFromFile) map.setView([home.lat, home.lon], 10);
    map.attributionControl.addAttribution(
      '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> ' +
      '&middot; access: <a href="https://www.herengaanuku.govt.nz/">Herenga &#257; Nuku</a>');
  })
  .catch(err => {
    document.getElementById("body").innerHTML =
      `<p class="empty"><strong>Could not load the peak data.</strong>
       Run <b>python build_data.py</b> first, then open this page again.
       If you opened this file directly, your browser may be blocking the data
       file. Start a local server instead: <b>python -m http.server</b> in this
       folder, then visit localhost:8000.<br><br>${esc(err.message)}</p>`;
  });
</script>
</body>
</html>
